name: probe feeds

# Manual check of what the nextbike feeds offer: time fields per bike/station,
# GBFS ttl (how often the data is refreshed) and response sizes. Read-only.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        shell: python
        run: |
          import json, gzip, time, urllib.request
          UA = {"User-Agent": "kvb-bike-tracker probe (+https://github.com/eneuberg/kvb-bike-tracker)", "Accept-Encoding": "gzip"}
          def get(url):
              t = time.time()
              with urllib.request.urlopen(urllib.request.Request(url, headers=UA), timeout=60) as r:
                  raw = r.read(); enc = r.headers.get("Content-Encoding"); hdr = dict(r.headers)
              body = gzip.decompress(raw) if enc == "gzip" else raw
              print(f"\n=== {url}\n  {len(raw)} bytes on the wire ({enc}), {len(body)} bytes, {time.time()-t:.2f}s")
              print("  headers:", {k: v for k, v in hdr.items() if k.lower() in ("cache-control", "age", "last-modified", "etag", "expires", "date", "x-ratelimit-limit", "x-ratelimit-remaining", "retry-after")})
              return json.loads(body)
          def keys_with_time(o, path=""):
              out = set()
              if isinstance(o, dict):
                  for k, v in o.items():
                      if any(x in k.lower() for x in ("time", "date", "last", "updated", "reported", "since", "ts", "ttl")):
                          out.add(f"{path}.{k}={str(v)[:40]}")
                      out |= keys_with_time(v, f"{path}.{k}")
              elif isinstance(o, list) and o:
                  out |= keys_with_time(o[0], f"{path}[0]")
              return out
          live = get("https://api.nextbike.net/maps/nextbike-live.json?domains=kg")
          print("  time-like fields:", sorted(keys_with_time(live))[:40])
          city = live["countries"][0]["cities"][0]
          place = next(p for p in city["places"] if p.get("bike_list"))
          print("  place keys:", sorted(place.keys()))
          print("  bike keys:", sorted(place["bike_list"][0].keys()))
          for v in ("2", "3"):
              try:
                  g = get(f"https://gbfs.nextbike.net/maps/gbfs/v{v}/nextbike_kg/gbfs.json")
                  print("  ttl:", g.get("ttl"), "last_updated:", g.get("last_updated"), "version:", g.get("version"))
                  feeds = g["data"].get("de", g["data"].get("en", next(iter(g["data"].values()))))["feeds"] if v == "2" else g["data"]["feeds"]
                  for f in feeds:
                      if any(n in f["name"] for n in ("free_bike_status", "vehicle_status", "station_status", "system_information")):
                          d = get(f["url"])
                          print("  ttl:", d.get("ttl"), "last_updated:", d.get("last_updated"))
                          data = d.get("data", {})
                          for key in ("bikes", "vehicles", "stations"):
                              if data.get(key):
                                  print(f"  {key}: {len(data[key])}, first:", json.dumps(data[key][0])[:400])
              except Exception as e:
                  print(f"  GBFS v{v}: {e}")
