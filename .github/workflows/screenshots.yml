name: readme screenshots

# Manual: screenshots of the live app for the README (docs/screenshots/).
# Use the container URL for full trip data; GitHub Pages polls too rarely
# to show many trips.
on:
  workflow_dispatch:
    inputs:
      url:
        description: "App URL"
        default: "https://eneuberg.github.io/kvb-bike-tracker/"

permissions:
  contents: write

jobs:
  shots:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Screenshots
        run: |
          pip install -q playwright==1.49.1
          python -m playwright install --with-deps chromium > /dev/null
          python tools/screenshots.py "${{ inputs.url }}" docs/screenshots --readme
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          git diff --cached --quiet && exit 0
          git commit -q -m "README screenshots"
          for i in 1 2 3 4 5; do git pull -q --rebase && git push -q && exit 0; sleep $((i * 5)); done
          exit 1
