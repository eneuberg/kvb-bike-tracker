name: update map

on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 min (UTC); GitHub may start runs late under load
  workflow_dispatch:
    inputs:
      preview:
        description: "Also push map.png / heatmap.png to the 'preview' branch"
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - "tracker/**"
      - "requirements.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write   # commit history
  pages: write      # deploy map
  id-token: write

concurrency:
  group: update-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore basemap tile cache
        uses: actions/cache@v4
        with:
          path: data/tiles
          key: tiles-${{ hashFiles('tracker/tiles.py') }}

      - name: Fetch bikes, record history, render map
        env:
          TILE_API_KEY: ${{ secrets.TILE_API_KEY }}   # free CARTO basemap key (optional)
        run: python -m tracker once --publish-history

      - name: Commit history
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history
          if git diff --cached --quiet; then
            echo "no history changes"; exit 0
          fi
          git commit -q -m "history: $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "push failed after retries"; exit 1

      - name: Push preview images
        if: ${{ inputs.preview }}
        run: |
          tmp=$(mktemp -d); cp data/site/map.png data/site/heatmap.png "$tmp"/
          git checkout -q --orphan preview && git rm -rqf . && cp "$tmp"/*.png .
          git add map.png heatmap.png && git commit -q -m "preview $(date -u +%FT%TZ)"
          git push -qf origin preview

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: data/site

      - id: deploy
        uses: actions/deploy-pages@v4
